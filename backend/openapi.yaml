      - recipient_phone
      - vehicle
    OrderRating:
      type: object
      properties:
        stars:
          type: integer
          maximum: 5
          minimum: 1
      required:
      - stars
    OtpChallenge:
      type: object
      description: |-
        What the client needs to drive its countdown and resend button.

        The timings come from the server rather than being duplicated as constants
        in the app (section 43), so changing policy does not require a release.
      properties:
        expires_in:
          type: integer
        resend_available_in:
          type: integer
        otp_length:
          type: integer
        max_attempts:
          type: integer
      required:
      - expires_in
      - max_attempts
      - otp_length
      - resend_available_in
    OtpCode:
      type: object
      description: Any spelling is accepted; `services.clean_phone` normalises it.
      properties:
        phone_number:
          type: string
          maxLength: 20
        code:
          type: string
          maxLength: 10
          minLength: 4
      required:
      - code
      - phone_number
    PackageSizeEnum:
      enum:
      - SMALL
      - MEDIUM
      - LARGE
      type: string
      description: |-
        * `SMALL` - Small
        * `MEDIUM` - Medium
        * `LARGE` - Large
    PackageTypeEnum:
      enum:
      - DOCUMENTS
      - CLOTHES
      - FOOD
      - ELECTRONICS
      - HOUSEHOLD
      - OTHER
      type: string
      description: |-
        * `DOCUMENTS` - Documents
        * `CLOTHES` - Clothes
        * `FOOD` - Food
        * `ELECTRONICS` - Electronics
        * `HOUSEHOLD` - Household item
        * `OTHER` - Other
    PaymentMethodEnum:
      enum:
      - PAY_AFTER_DELIVERY
      type: string
      description: '* `PAY_AFTER_DELIVERY` - Pay after delivery'
    Phone:
      type: object
      description: Any spelling is accepted; `services.clean_phone` normalises it.
      properties:
        phone_number:
          type: string
          maxLength: 20
      required:
      - phone_number
    PurposeEnum:
      enum:
      - REGISTRATION
      - LOGIN
      - PHONE_CHANGE
      type: string
      description: |-
        * `REGISTRATION` - Registration
        * `LOGIN` - Login
        * `PHONE_CHANGE` - Phone change
    RegisterVerify:
      type: object
      description: Any spelling is accepted; `services.clean_phone` normalises it.
      properties:
        phone_number:
          type: string
          maxLength: 20
        code:
          type: string
          maxLength: 10
          minLength: 4
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
      required:
      - code
      - email
      - full_name
      - phone_number
    Resend:
      type: object
      description: Any spelling is accepted; `services.clean_phone` normalises it.
      properties:
        phone_number:
          type: string
          maxLength: 20
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
      required:
      - phone_number
      - purpose
    Session:
      type: object
      description: 'Returned by both verify endpoints: who signed in, and their tokens.'
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - customer
      - tokens
    StageEnum:
      enum:
      - REQUEST_CREATED
      - DRIVER_ASSIGNED
      - DRIVER_ARRIVING
      - PICKED_UP
      - DELIVERED
      type: string
      description: |-
        * `REQUEST_CREATED` - Request created
        * `DRIVER_ASSIGNED` - Driver assigned
        * `DRIVER_ARRIVING` - Driver arriving
        * `PICKED_UP` - Picked up
        * `DELIVERED` - Delivered
    StatusEnum:
      enum:
      - IN_TRANSIT
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `IN_TRANSIT` - In transit
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        access_expires_in:
          type: integer
          description: Seconds until the access token expires.
      required:
      - access
      - access_expires_in
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    VehicleEnum:
      enum:
      - MOTORCYCLE
      - CAR
      - VAN
      type: string
      description: |-
        * `MOTORCYCLE` - Motorcycle
        * `CAR` - Car
        * `VAN` - Van
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
