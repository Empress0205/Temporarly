name: jihudumie_app
description: "Jihudumie Logistics — Customer mobile app. Sprint 1: authentication."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.0.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope_800ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono_700Bold.ttf
          weight: 700
